version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Phoenix
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Phoenix
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Phoenix
  - package-ecosystem: cargo
    directory: /tests/glib-regression
    # Keep the retained upstream manifest intact; update compatible resolutions.
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Phoenix
