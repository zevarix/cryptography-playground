name: Feature request
description: Propose a change to the playground.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: For a new rule, describe its parameters and whether it loses information.
    validations:
      required: true
